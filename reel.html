    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; font-size: 16px; }
        body {
            font-family: 'Space Grotesk', system-ui, sans-serif;
            background: var(--color-dark-surface);
            color: #fff;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        ::-webkit-scrollbar { display: none; }
        a { color: inherit; text-decoration: none; }

        :root { --pad: clamp(1.5rem, 5vw, 4rem); }


        /* -- NAV ------------------------------------------- */
        nav.site-nav {
            position: absolute;
            top: 0; left: 0; right: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem var(--pad);
            color: #fff;
            font-size: 0.75rem;
            letter-spacing: 0.06em;
            font-weight: 400;
        }
        nav.site-nav .brand { font-weight: 500; letter-spacing: 0.02em; }
        nav.site-nav .brand { display: inline-flex; align-items: center; line-height: 0; }
        nav.site-nav .brand img { width: 160px; height: auto; display: block; }
        nav.site-nav .brand .slash { color: rgba(255,255,255,0.5); margin: 0 .35em; }
        nav.site-nav .nav-links { display: flex; gap: 2.25rem; align-items: center; }
        nav.site-nav .nav-links a { transition: color .2s, opacity .2s; opacity: 0.85; }
        nav.site-nav .nav-links a:hover { color: var(--color-accent); opacity: 1; }
        nav.site-nav .nav-links a.email {
            color: var(--color-accent);
            text-transform: uppercase;
            opacity: 1;
            letter-spacing: 0.08em;
        }
        nav.site-nav .nav-links a.email:hover { opacity: 0.7; }


        /* -- REEL STAGE ------------------------------------ */
        .reel-stage {
            position: relative;
            width: 100%;
            min-height: 100svh;
            background: var(--color-dark-surface);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: clamp(7rem, 12vw, 10rem) var(--pad) clamp(4rem, 8vw, 6rem);
        }

        .reel-meta {
            position: absolute;
            top: 5.5rem; left: 0; right: 0;
            z-index: 3;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            padding: 0 var(--pad);
            font-size: 0.7rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.55);
            font-variant-numeric: tabular-nums;
        }
        .reel-meta .meta-center { text-align: center; }
        .reel-meta .meta-right  { text-align: right; }

        .reel-eyebrow {
            font-size: var(--text-label);
            letter-spacing: var(--tracking-caps);
            text-transform: uppercase;
            color: rgba(255,255,255,0.55);
            margin-bottom: var(--space-md);
            display: flex; align-items: center; gap: 0.6rem;
        }
        .reel-eyebrow::before {
            content: "";
            display: inline-block;
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--color-accent);
        }

        .reel-title {
            font-size: var(--text-h1);
            font-weight: var(--weight-medium);
            letter-spacing: var(--tracking-tighter);
            line-height: var(--leading-tight);
            color: #fff;
            margin-bottom: clamp(2rem, 4vw, 3rem);
            max-width: 1440px;
            text-align: left;
            width: 100%;
        }
        .reel-title em {
            font-style: italic;
            font-weight: var(--weight-light);
            color: var(--color-accent);
        }
        .reel-title .dash {
            color: rgba(255,255,255,0.5);
            font-weight: 300;
            margin: 0 .15em;
        }


        /* -- VIDEO PLAYER ---------------------------------- */
        .video-block {
            position: relative;
            width: 100%;
            max-width: 1440px;
            background: #000;
            line-height: 0;
            cursor: pointer;
            overflow: hidden;
            aspect-ratio: 16 / 9;
        }
        .video-block video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }
        .video-block .poster {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
            transition: opacity .4s var(--ease-out);
        }
        .video-block .play-btn {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 130px; height: 130px;
            border-radius: 50%;
            background: rgba(255,255,255,0.10);
            border: 1px solid rgba(255,255,255,0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center;
            z-index: 2;
            transition: transform .4s var(--ease-out), background .3s, opacity .4s;
        }
        .video-block:hover .play-btn {
            transform: translate(-50%, -50%) scale(1.08);
            background: rgba(255,255,255,0.18);
        }
        .video-block .play-btn::after {
            content: "";
            display: block;
            width: 0; height: 0;
            border-style: solid;
            border-width: 16px 0 16px 26px;
            border-color: transparent transparent transparent #fff;
            margin-left: 7px;
        }
        .video-block .video-label {
            position: absolute;
            bottom: 1.5rem; right: 1.5rem;
            z-index: 2;
            color: rgba(255,255,255,0.7);
            font-size: 0.7rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            transition: opacity .4s;
        }
        .video-block.playing .poster,
        .video-block.playing .play-btn,
        .video-block.playing .video-label { opacity: 0; pointer-events: none; }


        /* -- FOOTER ---------------------------------------- */
        footer.case-footer {
            background: var(--color-dark-surface);
            color: #fff;
            padding: clamp(4rem, 8vw, 8rem) var(--pad) 3rem;
            border-top: var(--border-dark-subtle);
        }
        .case-footer-inner { max-width: 1440px; margin: 0 auto; }
        .footer-heading {
            font-size: clamp(3rem, 9vw, 8rem);
            font-weight: 700;
            line-height: 0.95;
            letter-spacing: -0.03em;
            margin-bottom: clamp(3rem, 6vw, 6rem);
        }
        .footer-heading em { color: var(--color-accent); font-style: italic; font-weight: 300; }
        .footer-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2.5rem;
            border-top: var(--border-dark-subtle);
            padding-top: 2.5rem;
            font-size: 0.6875rem;
            letter-spacing: 0.13em;
            text-transform: uppercase;
        }
        .footer-col-label {
            color: rgba(255,255,255,0.5);
            margin-bottom: 1.5rem;
            display: block;
        }
        .footer-grid a, .footer-grid p {
            color: rgba(255,255,255,.55);
            display: block;
            line-height: 2;
            transition: color .2s;
            font-weight: 400;
        }
        .footer-grid a:hover { color: var(--color-accent); }
        .footer-grid .footer-email {
            font-size: 0.75rem;
            letter-spacing: 0.04em;
            text-transform: none;
            color: rgba(255,255,255,.8);
            border-bottom: 1px solid rgba(255,255,255,.15);
            padding-bottom: 0.35rem;
            display: inline-block;
        }
        .footer-grid .footer-email:hover { color: var(--color-accent); border-color: var(--color-accent); }
        .footer-location {
            text-transform: none;
            letter-spacing: 0.03em;
            font-weight: 300;
            color: rgba(255,255,255,.4);
            line-height: 1.8;
        }
        .footer-copy {
            color: rgba(255,255,255,.2);
            margin-top: 0.75rem;
            font-size: 0.6rem;
        }


        /* -- REVEAL ---------------------------------------- */
        .reveal {
            opacity: 0;
            transform: translateY(28px);
            transition: opacity .75s var(--ease-out), transform .75s var(--ease-out);
        }
        .reveal.visible { opacity: 1; transform: none; }


        /* -- RESPONSIVE ------------------------------------ */
        @media (max-width: 768px) {
            nav.site-nav .nav-links { gap: 1.25rem; font-size: 0.7rem; }
            nav.site-nav .nav-links a:nth-child(2),
            nav.site-nav .nav-links a:nth-child(3) { display: none; }
            .footer-grid { grid-template-columns: 1fr 1fr; }
            .video-block .play-btn { width: 90px; height: 90px; }
            .video-block .play-btn::after { border-width: 12px 0 12px 19px; }
        }
    
        /* -- BRAND FONT MAPPING (2026 identity) -------------------
           Display (Syne) · big headings; Mono (Space Mono) · caps/labels;
           Body (Space Grotesk) · inherits from body for everything else. */
        .case-hero-title,
        .case-section h2,
        .next-project h2,
        .footer-heading,
        .reel-title {
            font-family: 'Syne', sans-serif;
        }
        nav.site-nav,
        nav.site-nav a,
        .case-meta,
        .reel-meta,
        .intro-eyebrow,
        .video-block .video-label,
        .next-project .label,
        .credits-category,
        .cr-role,
        .reel-credits .cr-key,
        .footer-col-label,
        .footer-copy,
        .external-link {
            font-family: 'Space Mono', monospace;
        }

        .footer-cta-email {
            display: inline-block;
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(1.2rem, 2.6vw, 2rem);
            font-weight: 500;
            color: #fff;
            border-bottom: 2px solid var(--color-accent);
            padding-bottom: 0.3rem;
            margin-bottom: clamp(3rem, 6vw, 6rem);
            transition: color .2s;
        }
        .footer-cta-email:hover { color: var(--color-accent); }
        .footer-heading { margin-bottom: clamp(1.5rem, 3vw, 2.5rem); }
    </style>
</head>
<body>


<!-- ----------------------------------------------------- REEL -->
<section class="reel-stage">

    <nav class="site-nav">

        <div class="nav-links">

            src="assets/Reel/Rell_2026_v1_COMP.mp4"
            preload="metadata"
            playsinline></video>

<footer class="case-footer">
    <div class="case-footer-inner">
        <h2 class="footer-heading reveal">
            Let's render<br>
            <em>something.</em>
        </h2>
        <a href="mailto:cesar@cesoi.de?subject=Project%20inquiry" class="footer-cta-email reveal">cesar@cesoi.de</a>
        <div class="footer-grid reveal">
            <div>
                <span class="footer-col-label">Get in touch</span>
                <a href="mailto:cesar@cesoi.de" class="footer-email">cesar@cesoi.de</a>
            </div>
            <div>
                <span class="footer-col-label">Social</span>
                <a href="https://www.instagram.com/cesoi.de/" target="_blank" rel="noopener noreferrer">Instagram</a>
                <a href="https://www.behance.net/cesoide" target="_blank" rel="noopener noreferrer">Behance</a>

            </div>

                <span class="footer-col-label">Index</span>
                <a href="index.html#works">Works</a>
                <a href="index.html#about">About</a>
                <a href="mailto:cesar@cesoi.de">Contact</a>
            </div>
            <div>
                <span class="footer-col-label">Studio</span>
                <p class="footer-location">São Paulo, BR<br>UTC -3</p>
                <p class="footer-copy" style="margin-top:1.5rem;">© 2026 Cesar Barbosa</p>
            </div>
        </div>
    </div>
</footer>


<script>
    /* Live local clock · São Paulo */
    (function () {
        const el = document.getElementById('local-clock');
        if (!el) return;
        const fmt = new Intl.DateTimeFormat('en-GB', {
            timeZone: 'America/Sao_Paulo',
            hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
        });
        const tick = () => { el.textContent = fmt.format(new Date()) + ' BRT'; };
        tick(); setInterval(tick, 1000);
    })();

    /* Click-to-play reel */
    (function () {
        const block = document.getElementById('video-reel');
        if (!block) return;
        const video = block.querySelector('video');
        block.addEventListener('click', () => {
            if (block.classList.contains('playing')) {
                if (video.paused) { video.play(); }
                else { video.pause(); block.classList.remove('playing'); }
                return;
            }
            block.classList.add('playing');
            video.controls = true;
            video.play();
        });
    })();

    /* Reveal on scroll */
    const io = new IntersectionObserver((entries) => {
        entries.forEach(e => {
            if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); }
        });
    }, { threshold: 0.07 });
    document.querySelectorAll('.reveal').forEach(el => io.observe(el));
</script>
